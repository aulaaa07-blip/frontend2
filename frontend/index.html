<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Pengguna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #070f26;
        padding: 16px;
      }

      /* Container Modal / Card */
      .profile-card {
        position: relative;
        width: 100%;
        max-width: 390px;
        background-color: #0d1b42;
        border-radius: 20px;
        padding: 36px 26px 28px;
        color: #f3f4f6;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      }

      /* Tombol Close (X) */
      .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background-color: #23376d;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          transform 0.15s ease;
      }

      .close-btn:hover {
        background-color: #2e4687;
        transform: scale(1.05);
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 6px;
        letter-spacing: -0.01em;
      }

      .header p {
        font-size: 13px;
        color: #9aa6c4;
        font-weight: 400;
      }

      /* Bagian Foto Profil */
      .avatar-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 26px;
      }

      .avatar-wrapper {
        position: relative;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        padding: 4px;
        border: 2px solid #5d6e96;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        cursor: pointer;
      }

      .avatar-circle {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-color: #5d0d34;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .avatar-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .camera-badge {
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: #fff3cc;
        color: #0d1b42;
        border: 2px solid #0d1b42;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background-color 0.2s ease;
      }

      .camera-badge:hover {
        background-color: #f7e5ad;
        transform: scale(1.06);
      }

      .photo-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
      }

      .btn-link-primary {
        background: none;
        border: none;
        color: #f3f0e6;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }

      .btn-link-primary:hover {
        text-decoration: underline;
      }

      .dot-separator {
        color: #6b799e;
        font-size: 12px;
      }

      .btn-link-muted {
        background: none;
        border: none;
        color: #7d8bb0;
        font-weight: 500;
        font-size: 12.5px;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .btn-link-muted:hover {
        color: #cbd5e1;
      }

      /* Form Group */
      .form-group {
        margin-bottom: 20px;
      }

      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      label {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 8px;
      }

      .label-row label {
        margin-bottom: 0;
      }

      /* Tombol Reset Password kecil di kanan label */
      .reset-pw-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background-color: #1d3164;
        border: 1px solid #3c528c;
        color: #e2e8f0;
        font-size: 11.5px;
        font-weight: 600;
        padding: 4px 11px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .reset-pw-btn:hover {
        background-color: #263f7d;
        border-color: #546eb3;
      }

      /* Input Fields */
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .form-input {
        width: 100%;
        height: 46px;
        background-color: #1d3164;
        border: 1px solid #3a5088;
        border-radius: 12px;
        padding: 0 16px;
        color: #f8fafc;
        font-size: 14.5px;
        font-weight: 500;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .form-input:focus {
        border-color: #7c97db;
        box-shadow: 0 0 0 3px rgba(124, 151, 219, 0.18);
      }

      .form-input.has-icon {
        padding-right: 44px;
      }

      .toggle-pw-btn {
        position: absolute;
        right: 14px;
        background: none;
        border: none;
        color: #9aa6c4;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 4px;
      }

      .toggle-pw-btn:hover {
        color: #e2e8f0;
      }

      /* Tombol Aksi Bawah */
      .action-buttons {
        display: flex;
        gap: 12px;
        margin-top: 28px;
      }

      .btn-cancel {
        flex: 1;
        height: 46px;
        background-color: #1d3164;
        border: 1px solid #3a5088;
        border-radius: 12px;
        color: #f8fafc;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn-cancel:hover {
        background-color: #263f7d;
      }

      .btn-save {
        flex: 1.85;
        height: 46px;
        background-color: #fff3cc;
        border: none;
        border-radius: 12px;
        color: #0d1b42;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      .btn-save:hover {
        background-color: #f7e6b0;
      }

      .btn-save:active {
        transform: scale(0.99);
      }

      /* Notifikasi Toast Sederhana */
      .toast {
        margin-top: 14px;
        text-align: center;
        font-size: 12.5px;
        color: #fff3cc;
        min-height: 18px;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="profile-card" id="profileCard">
      <!-- Tombol Close -->
      <button
        type="button"
        class="close-btn"
        aria-label="Tutup"
        onclick="showToast('Modal ditutup')"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Header -->
      <div class="header">
        <h1>Profil Pengguna</h1>
        <p>Ubah foto, nama, atau reset password</p>
      </div>

      <!-- Foto Profil -->
      <div class="avatar-section">
        <input type="file" id="photoInput" accept="image/*" hidden />
        <div class="avatar-wrapper" onclick="triggerUpload()">
          <div class="avatar-circle">
            <img id="avatarPreview" alt="Foto Profil" />
          </div>
          <button type="button" class="camera-badge" aria-label="Ganti Foto">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"
              />
            </svg>
          </button>
        </div>

        <div class="photo-actions">
          <button
            type="button"
            class="btn-link-primary"
            onclick="triggerUpload()"
          >
            Ganti Foto Profil
          </button>
          <span class="dot-separator">•</span>
          <button type="button" class="btn-link-muted" onclick="removePhoto()">
            Hapus Foto
          </button>
        </div>
      </div>

      <!-- Form -->
      <form id="profileForm">
        <!-- Input Nama -->
        <div class="form-group">
          <label for="namaInput">Nama</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="namaInput"
              class="form-input"
              value="fina"
              placeholder="Masukkan nama"
              required
            />
          </div>
        </div>

        <!-- Input Password -->
        <div class="form-group">
          <div class="label-row">
            <label for="passwordInput">Password</label>
            <button
              type="button"
              class="reset-pw-btn"
              onclick="resetPassword()"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <polyline points="21 3 21 9 15 9"></polyline>
              </svg>
              Reset Password
            </button>
          </div>
          <div class="input-wrapper">
            <input
              type="password"
              id="passwordInput"
              class="form-input has-icon"
              value="1234"
              placeholder="Masukkan password"
              required
            />
            <button
              type="button"
              class="toggle-pw-btn"
              id="togglePwBtn"
              aria-label="Lihat Password"
              onclick="togglePassword()"
            >
              <!-- Ikon Mata -->
              <svg
                id="eyeIcon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Tombol Bawah -->
        <div class="action-buttons">
          <button type="button" class="btn-cancel" onclick="cancelChanges()">
            Batal
          </button>
          <button type="submit" class="btn-save">Simpan Perubahan</button>
        </div>

        <div class="toast" id="toastMsg"></div>
      </form>
    </div>

    <script>
      const photoInput = document.getElementById("photoInput");
      const avatarPreview = document.getElementById("avatarPreview");
      const namaInput = document.getElementById("namaInput");
      const passwordInput = document.getElementById("passwordInput");
      const eyeIcon = document.getElementById("eyeIcon");
      const toastMsg = document.getElementById("toastMsg");

      // Simpan nilai awal untuk fitur Batal
      let initialState = {
        nama: namaInput.value,
        password: passwordInput.value,
        photoSrc: "",
      };

      function showToast(text) {
        toastMsg.textContent = text;
        toastMsg.classList.add("show");
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toastMsg.classList.remove("show");
        }, 2500);
      }

      // Upload & Preview Foto
      function triggerUpload() {
        photoInput.click();
      }

      photoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          avatarPreview.src = event.target.result;
          avatarPreview.style.display = "block";
          showToast("Foto profil dipilih");
        };
        reader.readAsDataURL(file);
      });

      // Hapus Foto
      function removePhoto() {
        photoInput.value = "";
        avatarPreview.src = "";
        avatarPreview.style.display = "none";
        showToast("Foto profil dihapus");
      }

      // Toggle Lihat/Sembunyikan Password
      function togglePassword() {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";

        eyeIcon.innerHTML = isPassword
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      }

      // Reset Password
      function resetPassword() {
        passwordInput.value = "";
        passwordInput.type = "text";
        passwordInput.focus();
        showToast("Silakan masukkan password baru");
      }

      // Batal Perubahan
      function cancelChanges() {
        namaInput.value = initialState.nama;
        passwordInput.value = initialState.password;
        passwordInput.type = "password";
        if (initialState.photoSrc) {
          avatarPreview.src = initialState.photoSrc;
          avatarPreview.style.display = "block";
        } else {
          removePhoto();
        }
        showToast("Perubahan dibatalkan");
      }

      // Simpan Perubahan
      document.getElementById("profileForm").addEventListener("submit", (e) => {
        e.preventDefault();
        initialState = {
          nama: namaInput.value,
          password: passwordInput.value,
          photoSrc:
            avatarPreview.style.display === "block" ? avatarPreview.src : "",
        };
        showToast("Perubahan profil berhasil disimpan!");
      });
    </script>
  </body>
</html>
